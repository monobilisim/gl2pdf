apiVersion: apps/v1
kind: Deployment
metadata:
  name: gl2pdf
  namespace: gl2pdf
  labels:
    app: gl2pdf
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gl2pdf
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: gl2pdf
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001

      containers:
        - name: gl2pdf
          image: ghcr.io/monobilisim/gl2pdf:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gl2pdf-secret
                  key: ADMIN_TOKEN
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: gl2pdf-secret
                  key: DB_URL

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # If using SQLite, mount a PVC for the DB file (not needed with MySQL):
            # - name: db-data
            #   mountPath: /app

      volumes:
        - name: tmp
          emptyDir: {}
        # - name: db-data
        #   persistentVolumeClaim:
        #     claimName: gl2pdf-db-pvc

      # imagePullSecrets:
      #   - name: registry-secret
