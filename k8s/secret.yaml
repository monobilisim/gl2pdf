# ─────────────────────────────────────────────────────────────────────────────
# secret.yaml
#
# Since stringData is used, you can enter values as plain text —
# Kubernetes automatically base64-encodes them.
#
# To generate ADMIN_TOKEN:
#   python3 -c "import secrets; print(secrets.token_urlsafe(32))"
#
# DB_URL example (MySQL):
#   mysql+aiomysql://gl2pdf:S3cr3t@mysql-host:3306/gl2pdf
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: gl2pdf-secret
  namespace: gl2pdf
type: Opaque
stringData:
  ADMIN_TOKEN: ""        # generated admin token here (plain text)
  DB_URL: ""             # DB connection URL here (plain text)
